<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - KORA LIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <a href="index.html" class="logo" style="justify-content:center;margin-bottom:24px">
        <span class="logo-icon">⚽</span><span class="logo-text">KORA <b>LIVE</b></span>
      </a>
      <h2 id="authTitle">تسجيل الدخول</h2>
      <form id="authForm">
        <div class="form-group" id="nameGroup" style="display:none">
          <label>الاسم</label>
          <input type="text" id="nameInput" placeholder="اسمك الكامل">
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="emailInput" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="passInput" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="btn" style="width:100%;margin-top:8px" id="submitBtn">دخول</button>
        <p id="errorMsg" style="color:var(--live);text-align:center;margin-top:12px;font-size:13px"></p>
      </form>
      <p style="text-align:center;margin-top:20px;color:var(--text-muted);font-size:14px">
        <span id="switchText">ليس لديك حساب؟</span>
        <a href="#" id="switchMode" style="color:var(--primary);font-weight:700">إنشاء حساب</a>
      </p>
    </div>
  </div>

  <style>
    .auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .auth-box { background:var(--card); padding:36px; border-radius:20px; width:100%; max-width:420px; border:1px solid var(--border); }
    .auth-box h2 { text-align:center; margin-bottom:24px; font-size:22px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:13px; margin-bottom:6px; color:var(--text-muted); font-weight:600; }
    .form-group input {
      width:100%; padding:12px 14px; border-radius:10px;
      background:var(--bg-2); border:1px solid var(--border);
      color:var(--text); font-family:inherit; font-size:14px;
    }
    .form-group input:focus { outline:none; border-color:var(--primary); }
  </style>

  <script type="module">
    import { auth, db } from './js/firebase-config.js';
    import {
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let isLogin = true;
    const form = document.getElementById('authForm');
    const nameGroup = document.getElementById('nameGroup');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const passInput = document.getElementById('passInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const authTitle = document.getElementById('authTitle');
    const switchMode = document.getElementById('switchMode');
    const switchText = document.getElementById('switchText');

    switchMode.addEventListener('click', (e) => {
      e.preventDefault();
      isLogin = !isLogin;
      authTitle.textContent = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
      submitBtn.textContent = isLogin ? 'دخول' : 'إنشاء حساب';
      nameGroup.style.display = isLogin ? 'none' : 'block';
      switchText.textContent = isLogin ? 'ليس لديك حساب؟' : 'لديك حساب بالفعل؟';
      switchMode.textContent = isLogin ? 'إنشاء حساب' : 'دخول';
      errorMsg.textContent = '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'جارٍ...';
      try {
        if (isLogin) {
          await signInWithEmailAndPassword(auth, emailInput.value, passInput.value);
        } else {
          const cred = await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value);
          await updateProfile(cred.user, { displayName: nameInput.value });
          await setDoc(doc(db, 'users', cred.user.uid), {
            userId: cred.user.uid,
            name: nameInput.value,
            email: emailInput.value,
            photo: '',
            createdAt: serverTimestamp(),
            accountStatus: 'active',
            subscription: 'free'
          });
        }
        location.href = 'index.html';
      } catch (err) {
        const msgs = {
          'auth/user-not-found': 'المستخدم غير موجود',
          'auth/wrong-password': 'كلمة المرور خاطئة',
          'auth/email-already-in-use': 'البريد مستخدم بالفعل',
          'auth/invalid-email': 'بريد غير صالح',
          'auth/weak-password': 'كلمة المرور ضعيفة (6 أحرف على الأقل)',
          'auth/invalid-credential': 'بيانات الدخول غير صحيحة'
        };
        errorMsg.textContent = msgs[err.code] || err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLogin ? 'دخول' : 'إنشاء حساب';
      }
    });
  </script>
</body>
</html>
